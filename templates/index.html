<!DOCTYPE html>
<html>
<head>
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body class="container">
    <h1 class="mt-5">NLP - Emotion Detection</h1>
    <p>Please enter the text to be analyzed:</p>
    <div class="form-group">
        <textarea class="form-control" id="textToAnalyze" rows="3"></textarea>
    </div>
    <button class="btn btn-primary" onclick="runAnalysis()">Run Analysis</button>
    
    <h3 class="mt-5">Result of Emotion Detection</h3>
    <div id="system_response"></div>

    <script>
        function runAnalysis() {
            let text = document.getElementById("textToAnalyze").value;
            let xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    document.getElementById("system_response").innerHTML = xhttp.responseText;
                }
            };
            xhttp.open("GET", "emotionDetector?textToAnalyze=" + text, true);
            xhttp.send();
        }
    </script>
</body>
</html>
